<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootswatch/5.3.8/sketchy/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
    <title>Tomodachi life mii level tracker</title>
</head>
<body>
    
   <div class="container mt-4">
        <h1 class="display-4 text-center"><i class="fa-solid fa-bars-progress text-primary"></i>Tomodachi<span class="text-primary"> Mii</span> Level Tracker</h1>
        <form id="mii-form">
            <div class="mb-3">
                <label for="name" class="form-label">Name</label>
                <input type="text" id="name" class="form-control">
            </div>
            <div class="mb-3">
                <label for="level" class="form-label">Current Level</label>
                <input type="text" id="level" class="form-control">
            </div>
            <!-- slider drop down group -->
            <div class="row mb-3">
                <div class="col-md-6 mb-3 mb-md-0">
                    <label for="mii-status" class="form-label">Mii Status</label>
                    <select class="form-select" id="mii-status">
                        <option value="happy" selected>😊 Happy (Green)</option>
                        <option value="sad">😢 Sad (Blue)</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label for="exp" class="form-label">Level Progression (<span id="slider-value">50</span>%)</label>
                    <input type="range" class="form-range mt-2 range-happy" id="exp" min="0" max="100" value="50">
                </div>
            </div>

            <div class="mb-3">
                <label for="dislike" class="form-label">Disliked Items</label>
                <input type="text" id="dislike" class="form-control">
            </div>
            <div class="d-grid">
                <input type="submit" value="Add Mii" class="btn btn-primary">
            </div>
        </form>
        
        <table class="table table-striped mt-5">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Current Level</th>
                    <th>Happiness</th>
                    <th>Disliked Items</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="mii-list"></tbody>
        </table>

        <div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Edit Mii</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                    <label for="edit-name" class="form-label">Name</label>
                    <input type="text" id="edit-name" class="form-control">
                    </div>
                    <div class="mb-3">
                    <label for="edit-level" class="form-label">Current Level</label>
                    <input type="text" id="edit-level" class="form-control">
                    </div>
                    <div class="mb-3">
                    <label for="edit-status" class="form-label">Mii Status</label>
                    <select class="form-select" id="edit-status">
                        <option value="happy">😊 Happy</option>
                        <option value="sad">😢 Sad</option>
                    </select>
                    </div>
                    <div class="mb-3">
                    <label for="edit-exp" class="form-label">Level Progression (<span id="edit-slider-value">50</span>%)</label>
                    <input type="range" class="form-range" id="edit-exp" min="0" max="100">
                    </div>
                    <div class="mb-3">
                    <label for="edit-dislike" class="form-label">Disliked Items</label>
                    <input type="text" id="edit-dislike" class="form-control">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="save-edit-btn">Save Changes</button>
                </div>
                </div>
            </div>
        </div>
   </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
